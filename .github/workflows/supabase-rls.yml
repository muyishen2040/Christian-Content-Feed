name: Supabase migration and RLS

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-rls.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - name: Start disposable Supabase database and apply all migrations
        run: supabase db start
      - name: Install Postgres client if needed
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Verify two-user isolation, draft visibility and source access
        run: |
          PGPASSWORD=postgres psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -f supabase/tests/rls.sql
          PGPASSWORD=postgres psql -X -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -f supabase/tests/profile_migration_guard.sql
      - name: Re-apply clean migration history
        run: supabase db reset
