name: Embedding evaluation checks

on:
  pull_request:
    paths:
      - "ml-service/evaluation/**"
      - ".github/workflows/embedding-evaluation.yml"
  push:
    branches: [main]
    paths:
      - "ml-service/evaluation/**"
      - ".github/workflows/embedding-evaluation.yml"

permissions:
  contents: read

jobs:
  evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s ml-service/evaluation -p 'test_*.py'
