name: Functional feed integration

on:
  pull_request:
    paths:
      - "web/app/**"
      - "web/components/**"
      - "web/lib/**"
      - "web/scripts/check-functional-feed.mjs"
      - ".github/workflows/feed-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feed-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_FEED_API_MODE: http
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Install browser-test dependency without altering the lockfile
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start isolated test application
        run: |
          npm run start > /tmp/testimony-feed-integration.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/testimony-feed-integration.log
          exit 1
      - name: Exercise API paging, impressions, content rights and recovery states
        run: node scripts/check-functional-feed.mjs
